name: PRODUCTION workers

on:
  schedule:
    # Offset away from minute 00 to reduce GitHub schedule congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-workers
  cancel-in-progress: false

jobs:
  health-check:
    name: Check production health
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify public health endpoint
        run: |
          response="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 30 "https://wj-wine.vercel.app/api/health")"
          test "${response}" = '{"status":"ok"}'

  expire-reservations:
    name: Expire checkout reservations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call reservation expiry worker
        env:
          SCHEDULER_CRON_SECRET: ${{ secrets.SCHEDULER_CRON_SECRET }}
        run: |
          test -n "${SCHEDULER_CRON_SECRET}"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30 \
            --header "Authorization: Bearer ${SCHEDULER_CRON_SECRET}" \
            "https://wj-wine.vercel.app/api/internal/commerce/expire-reservations"

  process-operations:
    name: Process production operations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call operations worker
        env:
          SCHEDULER_CRON_SECRET: ${{ secrets.SCHEDULER_CRON_SECRET }}
        run: |
          test -n "${SCHEDULER_CRON_SECRET}"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30 \
            --header "Authorization: Bearer ${SCHEDULER_CRON_SECRET}" \
            "https://wj-wine.vercel.app/api/internal/operations/process"
